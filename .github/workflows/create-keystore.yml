name: Create WALPAP Signing Key

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Create keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore walpap-release.jks \
            -alias walpap \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "WALPAP_TEMP_2026" \
            -keypass "WALPAP_TEMP_2026" \
            -dname "CN=WALPAP, OU=WALPAP, O=WALPAP, L=Yogyakarta, ST=DIY, C=ID"

      - name: Convert keystore to Base64
        run: |
          base64 -w 0 walpap-release.jks > walpap-release.base64

      - name: Upload signing key
        uses: actions/upload-artifact@v4
        with:
          name: WALPAP-SIGNING-KEY
          path: walpap-release.base64
