name: Build WALPAP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build WALPAP Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install dependencies
      - name: Install dependencies
        run: npm install

      # 6. Create Android
      - name: Add Android platform
        run: npx cap add android

      # 7. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 8. Create Java directory
      - name: Create WALPAP Java directory
        run: |
          mkdir -p android/app/src/main/java/id/walpap/app

      # 9. Create wallpaper plugin
      - name: Create WALPAP Wallpaper Plugin
        run: |
          cat > android/app/src/main/java/id/walpap/app/WalpapWallpaperPlugin.java <<'EOF'
          package id.walpap.app;

          import android.app.WallpaperManager;
          import android.os.Build;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.BufferedInputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          @CapacitorPlugin(name = "WalpapWallpaper")
          public class WalpapWallpaperPlugin extends Plugin {

              @PluginMethod
              public void setWallpaper(PluginCall call) {

                  String imageUrl = call.getString("url");
                  String target = call.getString("target", "home");

                  if (imageUrl == null || imageUrl.trim().isEmpty()) {
                      call.reject("URL wallpaper tidak tersedia.");
                      return;
                  }

                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.N) {
                      call.reject("WALPAP membutuhkan Android 7.0 atau lebih baru.");
                      return;
                  }

                  new Thread(() -> {

                      HttpURLConnection connection = null;
                      InputStream inputStream = null;

                      try {

                          URL url = new URL(imageUrl);

                          connection =
                              (HttpURLConnection) url.openConnection();

                          connection.setConnectTimeout(15000);
                          connection.setReadTimeout(30000);
                          connection.setRequestMethod("GET");
                          connection.setDoInput(true);
                          connection.connect();

                          int responseCode =
                              connection.getResponseCode();

                          if (responseCode < 200 ||
                              responseCode >= 300) {

                              throw new Exception(
                                  "HTTP " + responseCode
                              );
                          }

                          inputStream =
                              new BufferedInputStream(
                                  connection.getInputStream()
                              );

                          WallpaperManager wallpaperManager =
                              WallpaperManager.getInstance(
                                  getContext()
                              );

                          int flags;

                          if ("lock".equalsIgnoreCase(target)) {
                              flags = WallpaperManager.FLAG_LOCK;
                          } else {
                              flags = WallpaperManager.FLAG_SYSTEM;
                          }

                          wallpaperManager.setStream(
                              inputStream,
                              null,
                              true,
                              flags
                          );

                          call.resolve();

                      } catch (Exception e) {

                          call.reject(
                              "Gagal memasang wallpaper: "
                              + e.getMessage()
                          );

                      } finally {

                          try {
                              if (inputStream != null) {
                                  inputStream.close();
                              }
                          } catch (Exception ignored) {
                          }

                          if (connection != null) {
                              connection.disconnect();
                          }
                      }

                  }).start();
              }
          }
          EOF

      # 10. Create MainActivity
      - name: Create MainActivity
        run: |
          cat > android/app/src/main/java/id/walpap/app/MainActivity.java <<'EOF'
          package id.walpap.app;

          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {

                  registerPlugin(
                      WalpapWallpaperPlugin.class
                  );

                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      # 11. Android permissions
      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = path.read_text()

          internet = (
              '    <uses-permission '
              'android:name="android.permission.INTERNET" />'
          )

          wallpaper = (
              '    <uses-permission '
              'android:name="android.permission.SET_WALLPAPER" />'
          )

          start = text.find("<manifest")

          if start == -1:
              raise SystemExit("ERROR: manifest tidak ditemukan.")

          end = text.find(">", start)

          if end == -1:
              raise SystemExit("ERROR: manifest tidak valid.")

          additions = []

          if "android.permission.INTERNET" not in text:
              additions.append(internet)

          if "android.permission.SET_WALLPAPER" not in text:
              additions.append(wallpaper)

          if additions:
              text = (
                  text[:end + 1]
                  + "\n"
                  + "\n".join(additions)
                  + text[end + 1:]
              )

          path.write_text(text)

          print("Permissions berhasil.")
          PY

      # 12. Decode signing key
      - name: Decode WALPAP signing key
        env:
          WALPAP_KEYSTORE_BASE64: ${{ secrets.WALPAP_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$WALPAP_KEYSTORE_BASE64" | base64 --decode > android/app/walpap-release.jks
          test -s android/app/walpap-release.jks
          echo "Signing key berhasil dibuat."

      # 13. Configure signing
      - name: Configure Android signing
        env:
          WALPAP_KEYSTORE_PASSWORD: ${{ secrets.WALPAP_KEYSTORE_PASSWORD }}
          WALPAP_KEY_ALIAS: ${{ secrets.WALPAP_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          signing_block = r'''
              signingConfigs {
                  release {
                      storeFile file("walpap-release.jks")
                      storePassword System.getenv("WALPAP_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("WALPAP_KEY_ALIAS")
                      keyPassword System.getenv("WALPAP_KEYSTORE_PASSWORD")
                  }
              }
          '''

          if "signingConfigs" not in text:
              text = text.replace(
                  "android {",
                  "android {" + signing_block,
                  1
              )

          text = text.replace(
              "buildTypes {",
              """buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }""",
              1
          )

          path.write_text(text)
          PY

      # 14. Set version
      - name: Set WALPAP version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          version_code = max(2, int(os.environ["RUN_NUMBER"]))

          text = re.sub(
              r'versionCode\s+\d+',
              f'versionCode {version_code}',
              text,
              count=1
          )

          text = re.sub(
              r'versionName\s+"[^"]+"',
              'versionName "2.0"',
              text,
              count=1
          )

          path.write_text(text)

          print("WALPAP versionCode:", version_code)
          print("WALPAP versionName: 2.0")
          PY

      # 15. Build Release APK
      - name: Build Release APK
        working-directory: android
        env:
          WALPAP_KEYSTORE_PASSWORD: ${{ secrets.WALPAP_KEYSTORE_PASSWORD }}
          WALPAP_KEY_ALIAS: ${{ secrets.WALPAP_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # 16. Check APK
      - name: Check APK
        run: |
          echo "========== APK =========="
          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print
          echo "========================="

      # 17. Rename APK
      - name: Rename APK
        run: |
          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            WALPAP-V2.apk

      # 18. Upload APK
      - name: Upload WALPAP APK
        uses: actions/upload-artifact@v4
        with:
          name: WALPAP-V2-APK
          path: WALPAP-V2.apk
          if-no-files-found: error
